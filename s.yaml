# NEXFLOW 阿里云函数计算（run-task / JWT / Tablestore）
#
# 打包：
#   cd demo/aliyun-fc-init-user && npm run deploy
#
# 部署（推荐，京港双函数）：
#   cd demo/aliyun-fc-init-user && node scripts/upload-fc-code.mjs
#
# 或 Serverless Devs（需配置 access + fc3 组件）：
#   s deploy
#
edition: 3.0.0
name: nexflow-fc
access: default

resources:
  nexflow-run-task:
    component: fc3
    props:
      region: cn-hongkong
      functionName: nexflow-api
      description: NEXFLOW SaaS run-task
      code: ./demo/aliyun-fc-init-user/nexflow-fc.zip
